[package]
name = "ieum-chain"
version = "1.0.2-1"
edition = "2024"

[dependencies]
axum = "0.8"
bip32 = "0.5"
bip39 = "2.2"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
libp2p = { version = "0.56", features = [
    "tokio",
    "quic",
    "dns",
    "identify",
    "kad",
    "mdns",
    "gossipsub",
    "autonat",
    "dcutr",
    "relay",
    "ping",
    "noise",
    "request-response",
    "cbor",
    "macros",
    "yamux",
] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
# P2P/원장 JSON에는 IEUM 최소 단위와 수수료를 담는 u128이 포함됩니다.
# 기본 serde_json 역직렬화기는 u128을 거부하므로 숫자 정밀도 지원을 명시합니다.
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1.47", features = ["full"] }
zstd = "0.13"
