name: Rust CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt, clippy, test, release build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check CI regression guards
        run: bash tests/ci_regression_guard.sh

      - name: Check Korean diagnostic scripts
        run: bash tests/diagnostic_scripts.sh

      - name: Check release build policy
        run: bash tests/release_build_policy.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets --all-features --locked

      - name: Run v0.23.8 operational basics
        run: bash tests/v0_23_8_operational_basics.sh

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run real four-process BFT network
        run: bash tests/four_process_network.sh target/release/ieum-chain
