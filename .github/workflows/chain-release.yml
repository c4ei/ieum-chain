name: Build and release IEUM Chain

on:
  push:
    tags:
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build, for example v1.0.1.1"
        required: true
        type: string
      force_build:
        description: "Build binaries even when only the fourth documentation revision changed"
        required: true
        default: false
        type: boolean

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  classify:
    name: Decide whether binaries are required
    runs-on: ubuntu-22.04
    outputs:
      build_binaries: ${{ steps.policy.outputs.build_binaries }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - id: policy
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v*.*.*.*' --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -1 || true)"
          build_binaries="$(bash scripts/should-build-release.sh "$RELEASE_TAG" "$previous_tag")"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
            build_binaries=true
          fi
          echo "build_binaries=$build_binaries" >> "$GITHUB_OUTPUT"
          echo "현재=$RELEASE_TAG 이전=${previous_tag:-없음} 바이너리빌드=$build_binaries"

  preflight:
    name: Fast release checks before OS builds
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          display_version="${RELEASE_TAG#v}"
          IFS='.' read -r major minor patch build extra <<<"$display_version"
          test -z "${extra:-}" && test -n "${build:-}"
          tag_version="${major}.${minor}.${patch}-${build}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version ($cargo_version) does not match tag ($tag_version)." >&2
            exit 1
          }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked

  build:
    needs: [classify, preflight]
    if: needs.classify.outputs.build_binaries == 'true'
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: ieum-chain
            asset: ieum-chain-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ieum-chain.exe
            asset: ieum-chain-windows-x86_64.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: ieum-chain
            asset: ieum-chain-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            binary: ieum-chain
            asset: ieum-chain-macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install static SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows-static
          $sqliteLib = Join-Path `
            $env:VCPKG_INSTALLATION_ROOT `
            "installed\x64-windows-static\lib"
          "RUSTFLAGS=-Ctarget-feature=+crt-static -Lnative=$sqliteLib" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare asset and checksum
        shell: bash
        env:
          SOURCE: target/${{ matrix.target }}/release/${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "$SOURCE" "release/$ASSET"
          python - "$ASSET" <<'PY'
          import hashlib
          import pathlib
          import sys

          name = sys.argv[1]
          path = pathlib.Path("release") / name
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          (path.parent / f"{name}.sha256").write_text(
              f"{digest}  {name}\n", encoding="utf-8"
          )
          PY

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish signed GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check *.sha256

      - name: Create and verify signed update manifest
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.IEUM_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY" || {
            echo "IEUM_RELEASE_PRIVATE_KEY secret is missing." >&2
            exit 1
          }

          private_key="$RUNNER_TEMP/ieum-release-private.pem"
          unsigned="$RUNNER_TEMP/update-manifest.unsigned.json"
          signature="$RUNNER_TEMP/update-manifest.signature"
          public_key="$RUNNER_TEMP/ieum-release-public.pem"
          cleanup() { rm -f "$private_key" "$unsigned" "$signature" "$public_key"; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' "$RELEASE_PRIVATE_KEY" > "$private_key"

          openssl pkey -in "$private_key" -check -noout
          openssl pkey -in "$private_key" -pubout -out "$public_key"

          expected_key="$(python -c 'import json; print(json.load(open("config/update.json"))["release_public_key"])')"
          actual_key="$(openssl pkey -in "$private_key" -pubout -outform DER 2>/dev/null | tail -c 32 | python -c 'import sys; print(sys.stdin.buffer.read().hex())')"
          test "$expected_key" = "$actual_key" || {
            echo "Release secret does not match config/update.json public key." >&2
            exit 1
          }

          version="${RELEASE_TAG#v}"
          protocol_version="$(sed -n 's/^const SUPPORTED_PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);/\1/p' src/main.rs | head -n1)"
          artifact_sha256="$(awk '{print $1}' release/ieum-chain-linux-x86_64.sha256)"
          published_at="$(date +%s)"
          test -n "$protocol_version"
          test "${#artifact_sha256}" -eq 64

          VERSION="$version" \
          PROTOCOL_VERSION="$protocol_version" \
          PUBLISHED_AT="$published_at" \
          ARTIFACT_SHA256="$artifact_sha256" \
          UNSIGNED_MANIFEST="$unsigned" \
          python - <<'PY'
          import json
          import os

          manifest = {
              "version": os.environ["VERSION"],
              "protocol_version": int(os.environ["PROTOCOL_VERSION"]),
              "mandatory": False,
              "published_at": int(os.environ["PUBLISHED_AT"]),
              "notes": f"IEUM Chain v{os.environ['VERSION']} signed release",
              "artifacts": {
                  "linux-x86_64": {
                      "url": "https://github.com/c4ei/ieum-chain/releases/latest/download/ieum-chain-linux-x86_64",
                      "sha256": os.environ["ARTIFACT_SHA256"],
                  }
              },
          }
          with open(os.environ["UNSIGNED_MANIFEST"], "w", encoding="utf-8") as file:
              json.dump(manifest, file, ensure_ascii=False, separators=(",", ":"))
          PY

          openssl pkeyutl -sign -rawin -inkey "$private_key" \
            -in "$unsigned" -out "$signature"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$unsigned" -sigfile "$signature"

          UNSIGNED_MANIFEST="$unsigned" \
          SIGNATURE_FILE="$signature" \
          SIGNED_MANIFEST="release/update-manifest.json" \
          python - <<'PY'
          import json
          import os
          import pathlib

          with open(os.environ["UNSIGNED_MANIFEST"], encoding="utf-8") as file:
              manifest = json.load(file)
          manifest["signature"] = pathlib.Path(os.environ["SIGNATURE_FILE"]).read_bytes().hex()
          with open(os.environ["SIGNED_MANIFEST"], "w", encoding="utf-8") as file:
              json.dump(manifest, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IEUM Chain $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
